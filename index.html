<style>

  --accent:#5cc4a8; --accent-ink:#06231c; --tape:#e2b92c; --tape-ink:#1d1700;
  --bad:#ff8a80; --bad-bg:#3a1714; --warn:#f2c46b; --warn-bg:#352a10; --ok:#8fd694; --ok-bg:#16301a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#161e1b; --sunk:#1d2723; --ink:#e4ebe8; --muted:#94a39c; --line:#2b3632;
  --accent:#5cc4a8; --accent-ink:#06231c; --tape:#e2b92c; --tape-ink:#1d1700;
  --bad:#ff8a80; --bad-bg:#3a1714; --warn:#f2c46b; --warn-bg:#352a10; --ok:#8fd694; --ok-bg:#16301a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.35}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.num,td.n,input.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;max-width:1280px;margin:0 auto}

/* tables */
.tframe{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15px}

td.n,th.n{text-align:right;white-space:nowrap}

.clist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}

.crow .tot{text-align:right}

.crow .lbl{display:none}
.crow.sorting{grid-template-columns:36px minmax(0,1fr) auto}
.handle{cursor:grab;touch-action:none;user-select:none;font-size:20px;color:var(--muted);text-align:center;line-height:1}
.crow.dragging{opacity:.4}
.crow.dropbefore{box-shadow:inset 0 3px 0 var(--accent)}
.mini{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;min-width:36px;min-height:34px;cursor:pointer}
@media (max-width:640px){
  .crow{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:6px}

  .crow .tot{grid-column:1/-1;text-align:left}

}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
details summary{cursor:pointer;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.gc td input{width:110px}
.gc tr.cyc td{background:var(--sunk);font-size:13px;color:var(--muted);font-weight:600}
.gc tr.today td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:6px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}

.brand .hdr{margin-left:auto;display:flex;gap:6px;align-items:center}
.brand .hdr button{font:inherit;font-size:14px;font-weight:600;background:none;border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:4px 10px;cursor:pointer;min-height:32px}
.login{max-width:520px;margin:24px auto}
.login ol{padding-left:20px;margin:0;display:flex;flex-direction:column;gap:6px}
.login code{font-family:var(--f-num);font-size:13px;background:var(--sunk);padding:1px 5px;border-radius:3px}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-weight:600}
input:disabled{background:var(--sunk);color:var(--ink);opacity:1;border-color:transparent}
.savebar{position:sticky;bottom:0;z-index:4;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:0 0 6px 6px}
.kv{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.kv .field{flex:1 1 120px;min-width:0}
.kv .field.wide{flex:3 1 220px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* ================= utilities ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DOW=["dom","lun","mar","mié","jue","vie","sáb"];
const DOWL=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
function toKey(d){return d.toISOString().slice(0,10)}
function fromKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))}
function addDays(k,n){const d=fromKey(k);d.setUTCDate(d.getUTCDate()+n);return toKey(d)}
function dow(k){return fromKey(k).getUTCDay()}
function todayKey(){const n=new Date();return toKey(new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())))}
function fmtD(k,long){if(!k)return"—";const d=fromKey(k);const s=String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0");return (long?DOWL[d.getUTCDay()]:DOW[d.getUTCDay()])+" "+s}
function fmtTS(iso){if(!iso)return"";const d=new Date(iso);return d.toLocaleDateString("es-UY",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("es-UY",{hour:"2-digit",minute:"2-digit"})}
function yymmdd(k){return k.slice(2,4)+k.slice(5,7)+k.slice(8,10)}
function parseNum(v){if(v==null)return null;if(typeof v==="number")return isFinite(v)?v:null;let s=String(v).trim();if(!s)return null;
  if(/^-?[\d.]+,\d+$/.test(s)||/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"").replace(",",".");else s=s.replace(",",".");
  const n=Number(s);return isFinite(n)?n:null}
function esNum(s){return Number(String(s).trim().replace(/\./g,"").replace(",","."))}
const nf1=new Intl.NumberFormat("es-UY",{maximumFractionDigits:1});
const nf2=new Intl.NumberFormat("es-UY",{maximumFractionDigits:2});
const nf0=new Intl.NumberFormat("es-UY",{maximumFractionDigits:0});
function fmt(n,d=1){if(n==null||!isFinite(n))return"—";if(Math.abs(n)<0.05&&d<=1)return"0";return(d===0?nf0:d===2?nf2:nf1).format(n)}
function wrin8(w){const[a,b]=w.split("/");return String(a).padStart(5,"0")+String(b).padStart(3,"0")}
function normWrin(v){if(v==null)return null;const s=String(v).replace(/[\s ]/g,"");const m=s.match(/^(\d+)\/(\d+)$/);return m?Number(m[1])+"/"+Number(m[2]):null}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function b64enc(str){const b=new TextEncoder().encode(str);let s="";for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64dec(b64){const bin=atob(b64.replace(/\s/g,""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* WRIN codes that changed between the old count sheet and the current usage report */
const REMAP={"26/756":"26/232","67/1":"67/279","2679/65":"2679/395","340/0":"340/69","830/3":"830/36","2180/3":"2180/12","9300/952":"9300/955"};

/* ================= state ================= */
const DEFAULT_CONFIG={countOrder:[],pedidoOrder:[],subSize:{},usoBase:"us",safety:0,countBeforeDelivery:true,countDays:[1,4],trailer:"2058 ANT",showAllInPedido:false};
const S={catalog:null,config:{...DEFAULT_CONFIG},counts:{},orders:{},movs:{},gc:{},panes:{uso:{},conteos:{},pedidos:{}},ready:false,
  ui:{tab:"pedido",countDate:null,countSearch:"",countFilter:"all",countSort:"mine",sorting:false,editing:{},pedDate:null,pedUnit:"cajas",pedFilter:"all",pedSearch:"",pedDraft:{},
      ordPreview:null,catSearch:"",gcFrom:null,confirm:null,xls:null,movTipo:"sale",login:null}};
const cat=()=>S.catalog?.items||{};
function item(w){return cat()[w]}

/* ================= storage adapters ================= */
/* Every document lives at "<collection>/<id>": store/catalog, store/config, store/gc, conteos/<fecha>, ordenes/<fecha llegada>, movimientos/<yyyy-mm> */
let A=null;            // active adapter
const pending={};      // path -> {data,t}
function persist(path,data,delay){
  clearTimeout(pending[path]?.t);
  const d=(delay??800)*(A?.slow||1);
  pending[path]={data,t:setTimeout(()=>flush(path),d)};
  setSync("Cambios sin guardar…");
}
async function flush(path){
  const p=pending[path];if(!p)return;clearTimeout(p.t);delete pending[path];
  setSync("Guardando…");
  try{await A.write(path,p.data);if(!Object.keys(pending).length)setSync(A.savedLabel)}
  catch(e){console.error(e);setSync("No se pudo guardar: "+(e.message||e.code||"error"));pending[path]=pending[path]||{data:p.data,t:setTimeout(()=>flush(path),15000)}}
}
async function flushAll(){await Promise.all(Object.keys(pending).map(flush))}
async function removeDoc(path){try{await A.del(path)}catch(e){console.error(e);toast("No se pudo borrar: "+(e.message||e.code))}}
function setSync(t){const el=$("#sync");if(el)el.textContent=t}

/* apply a whole collection snapshot without clobbering local unsaved edits */
function ingest(coll,docs){
  if(coll==="store"){for(const[id,d]of Object.entries(docs)){if(pending["store/"+id])continue;
    if(id==="catalog"){const items={};(d.items||[]).forEach(i=>items[i.w]=i);S.catalog={items,reportDate:d.reportDate,source:d.source}}
    if(id==="config")S.config={...DEFAULT_CONFIG,...d};
    if(id==="gc")S.gc=d.days||{};
    if(id==="panes")S.panes={uso:{},conteos:{},pedidos:{},...d};}return}
  const key={conteos:"counts",ordenes:"orders",movimientos:"movs"}[coll];if(!key)return;
  const next={...docs};for(const id of Object.keys(S[key]))if(pending[coll+"/"+id])next[id]=S[key][id];
  S[key]=next;
}

const DbAdapter=db=>({
  name:"claude",slow:1,savedLabel:"Guardado",
  start(){const cols=["store","conteos","ordenes","movimientos"];const seen=new Set();
    cols.forEach(c=>db.collection(c).onSnapshot(snap=>{const docs={};snap.docs.forEach(d=>{if(!d.metadata.hasPendingWrites||!pending[c+"/"+d.id])docs[d.id]=d.data()});
      ingest(c,docs);seen.add(c);if(seen.size===cols.length&&!S.ready){S.ready=true;setSync("Sincronizado");render()}else if(S.ready)softRender(c)},
      e=>setSync("Sin conexión con los datos ("+e.code+")")));},
  write(path,data){return db.doc(path).set(data)},
  del(path){return db.doc(path).delete()},
});
const LocalAdapter={
  name:"local",slow:1,savedLabel:"Guardado en este dispositivo",
  start(){const all=lsGet("cyp-local",{});const by={store:{},conteos:{},ordenes:{},movimientos:{}};
    for(const[p,d]of Object.entries(all)){const[c,id]=p.split("/");if(by[c])by[c][id]=d}
    Object.entries(by).forEach(([c,docs])=>ingest(c,docs));S.ready=true;setSync("Modo local: los datos quedan solo en este dispositivo");render()},
  async write(path,data){const all=lsGet("cyp-local",{});all[path]=data;lsSet("cyp-local",all)},
  async del(path){const all=lsGet("cyp-local",{});delete all[path];lsSet("cyp-local",all)},
};
const GH={
  name:"github",slow:4,savedLabel:"Guardado en GitHub",creds:null,meta:{},queue:Promise.resolve(),
  api(path,opt={}){return fetch("https://api.github.com/repos/"+this.creds.repo+path,{...opt,cache:"no-store",
    headers:{Authorization:"Bearer "+this.creds.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...(opt.headers||{})}})},
  async check(){const r=await this.api("");
    if(r.status===401)throw new Error("El token no es válido o venció.");
    if(r.status===404||r.status===403)throw new Error("No encuentro el repositorio, o el token no tiene acceso a él.");
    if(!r.ok)throw new Error("GitHub respondió "+r.status+".");
    const j=await r.json();if(j.permissions&&j.permissions.push===false)throw new Error("El token puede leer pero no escribir. Dale permiso Contents: Read and write.");return j},
  async start(){this.meta=lsGet("cyp-ghcache-"+this.creds.repo,{});await this.refresh(true);setInterval(()=>{if(document.visibilityState==="visible")this.refresh()},90000);
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")this.refresh()})},
  async refresh(first){
    if(this._busy)return;this._busy=true;if(!first)setSync("Buscando cambios…");
    try{
      const r=await this.api("/git/trees/HEAD?recursive=1");
      let files=[];
      if(r.ok){files=(await r.json()).tree.filter(t=>t.type==="blob"&&/^(store|conteos|ordenes|movimientos)\/[^/]+\.json$/.test(t.path))}
      else if(r.status===401){logout("Tu sesión venció. Volvé a ingresar el token.");return}
      else if(r.status!==409&&r.status!==404)throw new Error("GitHub respondió "+r.status);
      const live={};
      await Promise.all(files.map(async f=>{const p=f.path.slice(0,-5);live[p]=1;
        if(this.meta[p]?.sha===f.sha)return;
        const b=await this.api("/git/blobs/"+f.sha);if(!b.ok)throw new Error("No pude leer "+p);
        this.meta[p]={sha:f.sha,data:JSON.parse(b64dec((await b.json()).content))};}));
      for(const p of Object.keys(this.meta))if(!live[p])delete this.meta[p];
      lsSet("cyp-ghcache-"+this.creds.repo,this.meta);
      const by={store:{},conteos:{},ordenes:{},movimientos:{}};
      for(const[p,m]of Object.entries(this.meta)){const[c,id]=p.split("/");by[c][id]=m.data}
      Object.entries(by).forEach(([c,docs])=>ingest(c,docs));
      setSync(Object.keys(pending).length?"Cambios sin guardar…":"Sincronizado "+new Date().toLocaleTimeString("es-UY",{hour:"2-digit",minute:"2-digit"}));
      if(!S.ready){S.ready=true;render()}else softRender("all");
    }catch(e){console.error(e);setSync("Sin conexión con GitHub: "+e.message);if(!S.ready){S.ready=true;render()}}
    finally{this._busy=false}
  },
  write(path,data){const run=this.queue.then(()=>this._put(path,data));this.queue=run.catch(()=>{});return run},
  del(path){const run=this.queue.then(()=>this._del(path));this.queue=run.catch(()=>{});return run},
  async _sha(path){const r=await this.api("/contents/"+path+".json");if(r.status===404)return undefined;if(!r.ok)throw new Error("GitHub "+r.status);return(await r.json()).sha},
  async _put(path,data,retry){
    const body={message:"Actualiza "+path,content:b64enc(JSON.stringify(data,null,1))};const sha=this.meta[path]?.sha;if(sha)body.sha=sha;
    const r=await this.api("/contents/"+path+".json",{method:"PUT",body:JSON.stringify(body)});
    if((r.status===409||r.status===422)&&!retry){const cur=await this._sha(path);this.meta[path]={sha:cur,data:this.meta[path]?.data};if(!cur)delete this.meta[path];return this._put(path,data,true)}
    if(r.status===401){logout("Tu sesión venció. Volvé a ingresar el token.");throw new Error("sesión vencida")}
    if(!r.ok)throw new Error("GitHub respondió "+r.status);
    const j=await r.json();this.meta[path]={sha:j.content.sha,data};lsSet("cyp-ghcache-"+this.creds.repo,this.meta);
  },
  async _del(path){let sha=this.meta[path]?.sha||await this._sha(path);if(!sha)return;
    let r=await this.api("/contents/"+path+".json",{method:"DELETE",body:JSON.stringify({message:"Borra "+path,sha})});
    if(r.status===409||r.status===422){sha=await this._sha(path);if(!sha)return;r=await this.api("/contents/"+path+".json",{method:"DELETE",body:JSON.stringify({message:"Borra "+path,sha})})}
    if(!r.ok&&r.status!==404)throw new Error("GitHub respondió "+r.status);delete this.meta[path];lsSet("cyp-ghcache-"+this.creds.repo,this.meta)},
};
function logout(msg){if(A===GH&&GH.creds)lsDel("cyp-ghcache-"+GH.creds.repo);lsDel("cyp-gh");try{sessionStorage.removeItem("cyp-gh")}catch(_){}GH.creds=null;location.hash="";S.ready=false;showLogin(msg||"")}

/* ================= single-password access (GitHub version) =================
   acceso.json in the public app repo holds {repo, token} encrypted with AES-GCM; the key comes from the password via PBKDF2.
   The password itself is never stored anywhere. */
const ACCESS_ITER=600000;
const bytesToB64=b=>{let s="";for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)};
const b64ToBytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pwKey(pw,salt,iter){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function seal(obj,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await pwKey(pw,salt,ACCESS_ITER),new TextEncoder().encode(JSON.stringify(obj)));
  return{v:1,iter:ACCESS_ITER,salt:bytesToB64(salt),iv:bytesToB64(iv),ct:bytesToB64(new Uint8Array(ct))}}
async function unseal(box,pw){const key=await pwKey(pw,b64ToBytes(box.salt),box.iter);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(box.iv)},key,b64ToBytes(box.ct));return JSON.parse(new TextDecoder().decode(pt))}
function detectAppRepo(){const h=location.hostname.match(/^([\w-]+)\.github\.io$/i);if(!h)return"";const seg=location.pathname.split("/").filter(Boolean)[0];
  return h[1]+"/"+(seg&&!seg.includes(".")?seg:h[1]+".github.io")}
async function fetchAccess(){
  const app=detectAppRepo();
  if(app){try{const r=await fetch(`https://api.github.com/repos/${app}/contents/acceso.json`,{cache:"no-store",headers:{Accept:"application/vnd.github.raw+json"}});
    if(r.ok)return await r.json();if(r.status===404)return null}catch(_){}}
  try{const r=await fetch("acceso.json?t="+Date.now(),{cache:"no-store"});if(r.ok)return await r.json()}catch(_){}
  return null;
}
async function ghRepoCheck(repo,token){
  const r=await fetch("https://api.github.com/repos/"+repo,{cache:"no-store",headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json"}});
  if(r.status===401)throw new Error("El token no es válido o venció.");
  if(r.status===404||r.status===403)throw new Error(`El token no tiene acceso a ${repo}.`);
  if(!r.ok)throw new Error("GitHub respondió "+r.status+".");
  const j=await r.json();if(j.permissions&&j.permissions.push===false)throw new Error(`El token puede leer ${repo} pero no escribir. Dale Contents: Read and write.`);
}
async function writeAccess(app,token,box){
  const H={Authorization:"Bearer "+token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  const g=await fetch(`https://api.github.com/repos/${app}/contents/acceso.json`,{cache:"no-store",headers:H});const sha=g.ok?(await g.json()).sha:undefined;
  const body={message:"Actualiza acceso",content:b64enc(JSON.stringify(box,null,1))};if(sha)body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${app}/contents/acceso.json`,{method:"PUT",headers:H,body:JSON.stringify(body)});
  if(!r.ok)throw new Error(`No pude guardar el acceso en ${app} (GitHub ${r.status}).`);
}

const saveCatalog=()=>persist("store/catalog",{items:Object.values(cat()),reportDate:S.catalog?.reportDate||null,source:S.catalog?.source||null},300);
const saveConfig=()=>persist("store/config",S.config,600);
const saveGC=()=>persist("store/gc",{days:S.gc},900);
function isCountDay(k){return S.config.countDays.includes(dow(k))}
function nextCountDay(k){let d=addDays(k,1);for(let i=0;i<8;i++){if(isCountDay(d))return d;d=addDays(d,1)}return addDays(k,3)}
function prevCountDay(k){let d=addDays(k,-1);for(let i=0;i<8;i++){if(isCountDay(d))return d;d=addDays(d,-1)}return addDays(k,-3)}
function subSize(w){return S.config.subSize?.[w]||0}
function entryTotal(w,e){if(!e)return null;const it=item(w);const[c,s,u]=e;if(c==null&&s==null&&u==null)return null;return (c||0)*(it?.cc||0)+(s||0)*subSize(w)+(u||0)}
function stockAt(date,w){const c=S.counts[date];if(!c)return null;const t=entryTotal(w,c.items?.[w]);return t==null?0:t}
function orderUnits(o,w){const q=o?.items?.[w];if(!q)return 0;return q*(item(w)?.cc||0)}
function allMovs(){return Object.values(S.movs).flatMap(m=>m.items||[])}
function inWin(dd,a,b){return S.config.countBeforeDelivery?(dd>=a&&dd<b):(dd>a&&dd<=b)}
function inflowBetween(a,b,w){let s=0;for(const[k,o]of Object.entries(S.orders)){if(inWin(o.deliveryDate||k,a,b))s+=orderUnits(o,w)}
  for(const m of allMovs())if(m.w===w&&inWin(m.date,a,b))s+=m.units;return s}
function countDates(){return Object.keys(S.counts).filter(k=>Object.keys(S.counts[k]?.items||{}).length).sort()}
function usageBetween(a,b,w){const sa=stockAt(a,w),sb=stockAt(b,w);if(sa==null||sb==null)return null;return sa+inflowBetween(a,b,w)-sb}
function gcSum(from,to,f){let s=0,miss=[];for(let d=from;d<=to;d=addDays(d,1)){const v=S.gc[d]?.[f];if(v==null||v==="")miss.push(d);else s+=Number(v)}return{sum:s,miss}}
function realUsoMil(a,b,w){const u=usageBetween(a,b,w);if(u==null)return null;const g=gcSum(addDays(a,1),b,"r");if(g.miss.length||!g.sum)return null;return u/g.sum*1000}
function baseUso(w,realAvg){const it=item(w);if(!it)return{v:null,src:"—"};const b=S.config.usoBase;
  if(b==="real"){if(realAvg!=null)return{v:realAvg,src:"real"};return{v:it.us,src:"sem"}}
  return{v:it[b],src:{ud:"día",us:"sem",um_:"mes"}[b]}}
function countList(){return S.config.countOrder.filter(w=>item(w))}
function pedidoList(){const p=(S.config.pedidoOrder||[]).filter(w=>item(w));const set=new Set(p);return[...p,...countList().filter(w=>!set.has(w))]}

function computePedido(D){
  const D1=nextCountDay(D),D2=nextCountDay(D1);
  const dates=countDates().filter(k=>k<D);
  const p1=dates[dates.length-1]||null,p2=dates[dates.length-2]||null;
  const cbd=S.config.countBeforeDelivery;
  const arrivingOrder=cbd?Object.values(S.orders).find(o=>o.deliveryDate===D):null;
  const todayMovs=cbd?allMovs().filter(m=>m.date===D):[];
  const g1=gcSum(addDays(D,1),D1,"p"),g2=gcSum(addDays(D1,1),D2,"p"),gAll=gcSum(addDays(D,1),D2,"p");
  const safety=1+(Number(S.config.safety)||0)/100;
  const list=S.config.showAllInPedido?Object.keys(cat()).sort((a,b)=>item(a).d.localeCompare(item(b).d)):pedidoList();
  const extra=[...new Set([...(arrivingOrder?Object.keys(arrivingOrder.items):[]),...todayMovs.map(m=>m.w)])].filter(w=>!list.includes(w)&&item(w));
  const rows=[...list,...extra].map(w=>{
    const it=item(w);const cc=it.cc||1;
    const stock=stockAt(D,w);
    const arriving=(arrivingOrder?orderUnits(arrivingOrder,w):0)+todayMovs.filter(m=>m.w===w).reduce((a,m)=>a+m.units,0);
    const u1=p1?usageBetween(p1,D,w):null,u2=p2?usageBetween(p2,D,w):null;
    let realAvg=null;if(p2&&u2!=null){const g=gcSum(addDays(p2,1),D,"r");if(!g.miss.length&&g.sum)realAvg=u2/g.sum*1000}if(realAvg==null&&p1)realAvg=realUsoMil(p1,D,w);
    const uso=baseUso(w,realAvg);
    const need1=uso.v!=null?g1.sum/1000*uso.v*safety:null,need=uso.v!=null?gAll.sum/1000*uso.v*safety:null;
    const avail=(stock||0)+arriving,falta=need!=null?need-avail:null;
    const sug=falta!=null&&falta>0?Math.ceil(falta/cc-1e-9):0;
    return{w,it,cc,stock,arriving,u1,u2,realAvg,uso,need1,need,avail,sug,risk:need1!=null&&need1>0&&avail<need1};
  });
  return{D,D1,D2,p1,p2,arrivingOrder,todayMovs,g1,g2,gAll,rows};
}

/* ================= parsers ================= */
function parseJBO(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const items={},unknown=[],bad=[],descs={};let dd=null,od=null,trailer=null,ctrl=null;
  for(const l of lines){
    const m=l.match(/^JBO\s+(\d{6})\s+(\d{8})\s+(.+?)\s+(\d{1,6})\s+(\d{6})\s*(.*)$/);
    if(!m){bad.push(l);continue}
    dd=dd||m[1];od=od||m[5];trailer=trailer||m[6]||null;
    if(m[2]==="88888888"){ctrl=Number(m[4]);continue}
    const w=Number(m[2].slice(0,5))+"/"+Number(m[2].slice(5));
    items[w]=(items[w]||0)+Number(m[4]);descs[w]=m[3].trim();if(!item(w))unknown.push(w);
  }
  const k=s=>s?"20"+s.slice(0,2)+"-"+s.slice(2,4)+"-"+s.slice(4,6):null;
  return{deliveryDate:k(dd),orderDate:k(od),trailer,items,descs,unknown,bad,ctrl,total:Object.values(items).reduce((a,b)=>a+b,0)};
}
const USO_RX=/^(\d+)\s*\/\s*(\d+)\s+(.+?)\s+(KG|UNI|LT)\s+(-?[\d.,]+)\s+(-?[\d.,]+)\s+(-?[\d.,]+)\s+(-?[\d.,]+)\s+(-?[\d.,]+)$/;
function parseUsoLines(lines){
  const out={};let date=null;
  for(let l of lines){l=l.replace(/\s+/g," ").trim();
    const fd=l.match(/Fecha de negocio\s*:?\s*(\d{2})\/(\d{2})\/(\d{4})/i);if(fd)date=`${fd[3]}-${fd[2]}-${fd[1]}`;
    const m=l.match(USO_RX);if(!m)continue;const w=Number(m[1])+"/"+Number(m[2]);
    out[w]={w,d:m[3].trim(),um:m[4],p:esNum(m[5]),cc:esNum(m[6]),ud:esNum(m[7]),us:esNum(m[8]),um_:esNum(m[9])};
  }
  return{items:out,date};
}
async function pdfToLines(file){
  const lib=window.pdfjsLib;if(!lib)throw new Error("no se pudo cargar el lector de PDF");
  const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;const lines=[];
  for(let p=1;p<=doc.numPages;p++){const tc=await(await doc.getPage(p)).getTextContent();const rows=new Map();
    for(const it of tc.items){if(!it.str||!it.str.trim())continue;const y=Math.round(it.transform[5]/2)*2;if(!rows.has(y))rows.set(y,[]);rows.get(y).push(it)}
    [...rows.entries()].sort((a,b)=>b[0]-a[0]).forEach(([,its])=>{its.sort((a,b)=>a.transform[4]-b.transform[4]);lines.push(its.map(i=>i.str.trim()).join(" "))})}
  return lines;
}
function applyUso(parsed,srcName){
  if(!S.catalog)S.catalog={items:{}};let upd=0,nw=0;
  for(const[w,u]of Object.entries(parsed.items)){const cur=S.catalog.items[w];
    if(cur){Object.assign(cur,{d:u.d,um:u.um,p:u.p,cc:u.cc,ud:u.ud,us:u.us,um_:u.um_});upd++}else{S.catalog.items[w]=u;nw++}}
  S.catalog.reportDate=parsed.date||S.catalog.reportDate;S.catalog.source=srcName;saveCatalog();return{upd,nw};
}
function resolveWrin(w,desc){
  if(item(w))return w;if(REMAP[w]&&item(REMAP[w]))return REMAP[w];
  const base=w.split("/")[0],d=String(desc||"").trim().toUpperCase().slice(0,6);
  const hit=Object.keys(cat()).filter(x=>x.split("/")[0]===base&&(!d||item(x).d.toUpperCase().startsWith(d)));
  return hit.length===1?hit[0]:null;
}
const normH=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z/]/g,"");
async function parseListFile(file){
  if(/\.pdf$/i.test(file.name)||file.type==="application/pdf"){const p=parseUsoLines(await pdfToLines(file));if(!Object.keys(p.items).length)throw new Error("no encontré productos en el PDF");
    return{kind:"pdf",uso:p,list:Object.keys(p.items),descs:Object.fromEntries(Object.entries(p.items).map(([w,i])=>[w,i.d])),fileName:file.name}}
  if(!window.XLSX)throw new Error("no se pudo cargar el lector de Excel");
  const wb=XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:"array"});
  const sheetName=wb.SheetNames.find(n=>normH(n)==="pedido")||wb.SheetNames[0];
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,raw:true,defval:null});
  const hi=rows.findIndex(r=>r&&r.some(c=>normH(c)==="wrin"));if(hi<0)throw new Error("no encontré la columna Wrin en la hoja "+sheetName);
  const H=rows[hi].map(normH),cW=H.indexOf("wrin"),cD=H.findIndex(h=>h.startsWith("descrip")),cU=H.indexOf("um"),cC=H.findIndex(h=>h.startsWith("cant"));
  const list=[],descs={},extra={};
  for(const r of rows.slice(hi+1)){if(!r)continue;const raw=normWrin(r[cW]);if(!raw)continue;const d=cD>=0?String(r[cD]??"").trim():"";
    const w=resolveWrin(raw,d)||raw;if(list.includes(w))continue;list.push(w);descs[w]=d;
    if(!item(w)){let cc=parseNum(r[cC]);if(typeof r[cC]==="number"&&cc>=1000&&cc%1000===0)cc=cc/1000;extra[w]={w,d:d||w,um:cU>=0?String(r[cU]||"UNI"):"UNI",cc:cc||1,ud:null,us:null,um_:null}}}
  if(!list.length)throw new Error("la hoja "+sheetName+" no tiene productos");
  return{kind:"xlsx",sheetName,list,descs,extra,fileName:file.name};
}
function listDiff(L){const cur=new Set((S.config.pedidoOrder||[]).filter(w=>item(w))),nw=new Set(L.list);return{add:L.list.filter(w=>!cur.has(w)),rem:[...cur].filter(w=>!nw.has(w))}}
async function parseCountExcel(file){
  if(!window.XLSX)throw new Error("no se pudo cargar el lector de Excel");
  const wb=XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:"array"});
  const sheetName=wb.SheetNames.find(n=>normH(n)==="conteo")||wb.SheetNames[0];
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,raw:true,defval:null});
  const hi=rows.findIndex(r=>r&&r.some(c=>normH(c)==="wrin"));if(hi<0)throw new Error("no encontré la columna Wrin en la hoja "+sheetName);
  const H=rows[hi].map(normH);const col=n=>H.indexOf(n);
  const cW=col("wrin"),cD=H.findIndex(h=>h.startsWith("descrip")),cC=col("caja"),cS=col("subunidad"),cU=col("unidad"),cT=col("total");
  const items={},unknown=[];let empty=0;
  for(const r of rows.slice(hi+1)){if(!r)continue;const raw=normWrin(r[cW]);if(!raw)continue;
    let c=cC>=0?parseNum(r[cC]):null,s=cS>=0?parseNum(r[cS]):null,u=cU>=0?parseNum(r[cU]):null;const t=cT>=0?parseNum(r[cT]):null;
    if(c==null&&s==null&&u==null&&t!=null)u=t;
    if(c==null&&s==null&&u==null){empty++;continue}
    const w=resolveWrin(raw,cD>=0?r[cD]:"");
    if(!w){unknown.push(raw+(cD>=0&&r[cD]?" "+String(r[cD]).trim():""));continue}
    items[w]=[c,s,u];
  }
  return{sheetName,items,unknown,empty,fileName:file.name};
}

function buildJBO(P,qty){
  const dd=yymmdd(P.D1),od=yymmdd(P.D),tr=S.config.trailer||"2058 ANT";const lines=[];let tot=0;
  for(const r of P.rows){const q=Number(qty(r))||0;if(q<=0)continue;tot+=q;
    lines.push(`JBO ${dd} ${wrin8(r.w)} ${(r.it.d||"").toUpperCase().slice(0,13).padEnd(26," ")}${String(q).padStart(6,"0")} ${od} ${tr}`)}
  lines.push(`JBO ${dd} 88888888 REGISTRO FINAL DE CONTROL ${String(tot).padStart(6,"0")} ${od} ${tr}`);return lines.join("\n");
}

/* ---- GC ---- */
function renderGC(){
  const t=todayKey();const from=S.ui.gcFrom||(S.ui.gcFrom=prevCountDay(prevCountDay(prevCountDay(t))));const to=addDays(from,34);
  let rows="",d=addDays(from,1),cyc={p:0,r:0,start:d};
  while(d<=to){const v=S.gc[d]||{};
    rows+=`<tr class="${d===t?"today":""}"><td><b>${fmtD(d)}</b>${d===t?' <span class="chip neu">hoy</span>':""}</td>
      <td><input class="n" inputmode="numeric" data-gc="p" data-d="${d}" value="${v.p??""}" aria-label="GC proyectados ${fmtD(d)}"></td>
      <td><input class="n" inputmode="numeric" data-gc="r" data-d="${d}" value="${v.r??""}" aria-label="GC reales ${fmtD(d)}"></td></tr>`;
    cyc.p+=Number(v.p)||0;cyc.r+=Number(v.r)||0;
    if(isCountDay(d)){rows+=`<tr class="cyc"><td>Ciclo ${fmtD(cyc.start)} → ${fmtD(d)}</td><td class="n">${fmt(cyc.p,0)}</td><td class="n">${fmt(cyc.r,0)}</td></tr>`;cyc={p:0,r:0,start:addDays(d,1)}}
    d=addDays(d,1)}
  return`<div class="stack">
  <div class="row"><h2>GC por día</h2><span class="spacer"></span><button class="btn" data-gcshift="-14">← 2 semanas</button><button class="btn" data-gcshift="0">Hoy</button><button class="btn" data-gcshift="14">2 semanas →</button></div>
  <p class="muted small" style="max-width:65ch;margin:0">Proyectados: los que usa el cálculo del pedido. Reales: opcionales; con ellos la app calcula tu propio uso cada mil a partir de los conteos. Podés pegar una columna copiada de Excel en la primera celda y se reparte hacia abajo.</p>
  <div class="tframe gc" style="max-width:520px"><table><thead><tr><th>Día</th><th class="n">GC proyectados</th><th class="n">GC reales</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ================= Panes ================= */
const PAN_W=["1/922","2/833","3/703","6053/132"];
const PAN_ORDER_DAYS={0:3,1:4,4:4};          // domingo→miércoles, lunes→viernes, jueves→lunes (días hasta la llegada)
const PAN_DELIVERY_DAYS=[1,3,5];              // lunes, miércoles, viernes
const savePanes=()=>persist("store/panes",S.panes,700);
function panUso(w){const v=S.panes.uso?.[w];if(v!=null&&v!=="")return{v:Number(v),manual:true};const r=item(w)?.us;return{v:r??null,manual:false}}
function panStock(T,w){const e=S.panes.conteos?.[T]?.[w];if(!e)return null;const[c,u]=e;if(c==null&&u==null)return null;return(c||0)*(item(w)?.cc||0)+(u||0)}
function panDates(){return Object.keys(S.panes.conteos||{}).filter(k=>Object.values(S.panes.conteos[k]||{}).some(e=>e&&(e[0]!=null||e[1]!=null))).sort()}
function panPlan(T){
  const breads=PAN_W.filter(w=>item(w));
  const orders=[];for(let d=T,i=0;orders.length<3&&i<14;d=addDays(d,1),i++){const k=dow(d);if(k in PAN_ORDER_DAYS){
    const R=addDays(d,PAN_ORDER_DAYS[k]);let Rn=addDays(R,1);while(!PAN_DELIVERY_DAYS.includes(dow(Rn)))Rn=addDays(Rn,1);
    orders.push({O:d,R,coverTo:addDays(Rn,-1)})}}
  const horizon=orders.reduce((a,o)=>o.coverTo>a?o.coverTo:a,addDays(T,1));
  const decisionR=new Set(orders.map(o=>o.R));
  // entradas ya conocidas: pedidos de pan guardados (no los que decide este plan) + órdenes JBO
  const known={};const add=(d,w,u,src)=>{(known[d]||(known[d]={}))[w]=((known[d]||{})[w]||0)+u;(known[d]._src||(known[d]._src=new Set())).add(src)};
  for(const[R,p]of Object.entries(S.panes.pedidos||{})){if(R<=T||R>horizon||decisionR.has(R))continue;for(const w of breads){const q=Number(p.items?.[w])||0;if(q)add(R,w,q*(item(w).cc||0),"pan")}}
  for(const o of Object.values(S.orders)){const R=o.deliveryDate;if(!R||R<=T||R>horizon)continue;for(const w of breads){const q=Number(o.items?.[w])||0;if(q)add(R,w,q*(item(w).cc||0),"jbo")}}
  const days=[];for(let d=addDays(T,1);d<=horizon;d=addDays(d,1)){const g=S.gc[d]?.p;days.push({d,gc:g==null||g===""?null:Number(g),use:{},stock:{},inflow:{}})}
  const useOf=(day,w)=>{const u=panUso(w).v;return day.gc!=null&&u!=null?day.gc/1000*u:0};
  const stock={},result={};breads.forEach(w=>{stock[w]=panStock(T,w)??0;result[w]={}});
  const draft=S.ui.panDraft||{};
  for(const day of days){
    const o=orders.find(x=>x.R===day.d);
    for(const w of breads){
      let inflow=known[day.d]?.[w]||0;
      if(o){const cover=days.filter(x=>x.d>=o.R&&x.d<=o.coverTo);const need=cover.reduce((a,x)=>a+useOf(x,w),0);
        const otherIn=cover.reduce((a,x)=>a+(known[x.d]?.[w]||0),0);
        const avail=Math.max(0,stock[w])+otherIn;const cc=item(w).cc||1;
        const sug=Math.max(0,Math.ceil((need-avail)/cc-1e-9));
        const saved=S.panes.pedidos?.[o.R]?.items?.[w];
        const qty=draft[o.R]?.[w]!=null?draft[o.R][w]:(saved!=null?Number(saved):sug);
        result[w][o.R]={need,avail,sug,qty,saved:saved!=null};inflow+=qty*cc;}
      day.inflow[w]=inflow;day.use[w]=useOf(day,w);const left=stock[w]+inflow-day.use[w];day.short=day.short||{};day.short[w]=left<0?-left:0;stock[w]=Math.max(0,left);day.stock[w]=stock[w];
    }
  }
  const missGC=days.filter(x=>x.gc==null).map(x=>x.d);
  return{T,breads,orders,days,known,result,missGC,horizon};
}
function renderPanes(){
  if(!S.catalog)return noCatalog();
  const breads=PAN_W.filter(w=>item(w));
  const T=S.ui.panDate||(S.ui.panDate=todayKey());
  const P=panPlan(T);const C=S.panes.conteos?.[T]||{};
  const hasCount=breads.some(w=>panStock(T,w)!=null);
  const general=S.counts[T]?.items;const canPull=general&&breads.some(w=>general[w]);
  const short=breads.filter(w=>P.days.some(d=>d.short[w]>0.5));

    </tbody></table></div>

  <h3 style="margin:6px 0 0">Pedidos a hacer</h3>
  <div class="tframe"><table>
    <thead><tr><th class="stick">Pedido</th>${breads.map(w=>`<th class="n order">${nm(w)} (cj)</th>`).join("")}<th></th></tr></thead>

    const move=e=>{const el=document.elementFromPoint(e.clientX,e.clientY)?.closest("#sortList .crow");
      if(over&&over!==el)over.classList.remove("dropbefore");if(el&&el!==row){el.classList.add("dropbefore");over=el}
      if(e.clientY<70)window.scrollBy(0,-12);else if(e.clientY>window.innerHeight-50)window.scrollBy(0,12)};
    const up=()=>{h.removeEventListener("pointermove",move);h.removeEventListener("pointerup",up);h.removeEventListener("pointercancel",up);row.classList.remove("dragging");
      if(over){over.classList.remove("dropbefore");const o=S.config.countOrder.filter(w=>w!==row.dataset.w);o.splice(o.indexOf(over.dataset.w),0,row.dataset.w);S.config.countOrder=o;saveConfig();render()}};
    h.addEventListener("pointermove",move);h.addEventListener("pointerup",up);h.addEventListener("pointercancel",up);
  }));
}
(function(){const h=(location.hash||"").slice(1);if(["pedido","panes","conteo","ordenes","gc","ajustes"].includes(h))S.ui.tab=h})();
window.addEventListener("pagehide",()=>{Object.keys(pending).forEach(flush)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")Object.keys(pending).forEach(flush)});
render();boot();

</script>
</body></html>
